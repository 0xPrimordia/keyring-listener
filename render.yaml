services:
  - type: worker
    name: keyring-schedule-listener
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: HEDERA_NETWORK
        sync: false
      - key: HEDERA_OPERATOR_ACCOUNT_ID
        sync: false
      - key: HEDERA_OPERATOR_PRIVATE_KEY
        sync: false
      - key: SCHEDULE_REVIEW_TRIGGER_CONTRACT_ADDRESS
        sync: false
      - key: HGRAPH_PUBLIC_KEY
        sync: false
      - key: LOG_LEVEL
        sync: false
